name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [ nuxt ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Garante Node compatível com Nuxt 4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      # Build do app
      - run: npm ci
      - run: npm run build

      # Upload pro Static Web Apps (usa os arquivos já construídos)
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AmadeusBar }} # o seu segredo pode ter nome diferente; mantenha o que já existe
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: ".output/public"
          skip_app_build: true
